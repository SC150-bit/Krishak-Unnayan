<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishak Unnayan Portal | कृषक उन्नयन</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script 
      src="https://maps.googleapis.com/maps/api/js?key=AlzaSyBGMbfYysyTC4x45KdCP9BGmsaO225gViM&libraries=places" 
      async 
      defer>
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root">
      <!-- Chat Input Controls -->
      <form id="chatForm" class="chat-form">
        <div class="chat-input-container">
          <button type="button" id="langToggleBtn" class="btn-lang">En ⇄ Regional</button>
          <input type="text" id="chatInput" placeholder="Ask about procurement rules, timing, or crop quality..." />
          <button type="button" id="micBtn" class="btn-mic" aria-label="Voice Input">🎙️</button>
          <button type="submit" id="sendBtn">Send</button>
        </div>
      </form>
    </div>

    <!-- Verification Modal -->
    <div id="verificationModal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3>Identity Verification</h3>
        <p>Please enter your 12-digit identification number for slot booking validation:</p>
        <input type="text" id="idInput" maxlength="12" placeholder="Enter 12-digit ID" />
        <div class="modal-actions">
          <button type="button" id="closeModalBtn" class="btn-secondary">Cancel</button>
          <button type="button" id="verifyBtn" class="btn-primary">Send OTP</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
